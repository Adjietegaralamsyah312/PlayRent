# Simple workflow for deploying static content to GitHub Pages
#
# DISABLED (manual only). This is the boilerplate workflow GitHub offers when
# a repository is created. It uploads the REPOSITORY ROOT as the Pages
# artifact, so enabling it on push would publish the whole source tree
# (including server/src) on the public site and race the real deploy.
# The real deployment is .github/workflows/deploy.yml (Vite build -> Pages).
name: Deploy static content to Pages

on:
  # Manual only — the real deploy lives in deploy.yml.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
