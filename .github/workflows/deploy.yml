
name: Deploy PlayRent Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check TypeScript
        working-directory: web
        run: npm run typecheck

      # Fail fast. Vite only inlines VITE_* vars that exist at build time, so a
      # missing repository variable produces a bundle with RELATIVE /api paths.
      # From GitHub Pages that resolves to
      # https://adjietegaralamsyah312.github.io/api/... -> 404 on every call,
      # i.e. a silently broken deploy. Refuse to build instead, so the previous
      # deployment stays intact.
      #
      # The value must be an ORIGIN and nothing else: scheme://host[:port].
      # The frontend appends '/api' itself, so a path/query/fragment in the
      # variable yields 'https://host/app/api/...' -> 404 on every call, and it
      # still PASSES the "is it inlined?" check below (the string really is in
      # the bundle). Reject it here instead (review NEW-1).
      - name: Check VITE_API_BASE_URL repository variable
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          value="$VITE_API_BASE_URL"

          if [ -z "$value" ]; then
            echo "::error::Repository variable VITE_API_BASE_URL is not set — build aborted, nothing was deployed."
            echo "::error::Set it at: repo Settings -> Secrets and variables -> Actions -> Variables -> New repository variable -> name 'VITE_API_BASE_URL' -> value 'https://<tunnel-host>' (origin only: no trailing slash, no /api)."
            exit 1
          fi

          # Whitespace anywhere (inside or at the edges) is rejected: the value
          # is baked into the bundle verbatim, so a stray space or newline
          # would produce an origin no browser can resolve. (We deliberately do
          # NOT strip it — silently repairing the value would hide the typo.)
          case "$value" in
            *[[:space:]]*)
              echo "::error::VITE_API_BASE_URL='$value' contains whitespace — the origin must be a single token (no spaces, no trailing newline)."
              exit 1
              ;;
          esac

          case "$value" in
            http://*|https://*) ;;
            *)
              echo "::error::VITE_API_BASE_URL='$value' is not a valid origin. Expected something like 'https://<tunnel-host>' (scheme + host, no path)."
              exit 1
              ;;
          esac

          # Everything after the scheme must be host[:port] only.
          rest="${value#*://}"

          case "$rest" in
            ''|:*)
              echo "::error::VITE_API_BASE_URL='$value' has no host."
              exit 1
              ;;
          esac

          case "$rest" in
            */api|*/api/)
              echo "::error::VITE_API_BASE_URL='$value' must be the API ORIGIN only — the frontend appends '/api' itself. Drop the trailing '/api'."
              exit 1
              ;;
          esac

          case "$rest" in
            */*|*\?*|*\#*)
              echo "::error::VITE_API_BASE_URL='$value' must be the ORIGIN only (scheme://host[:port]) — no path, no query, no fragment. The frontend appends '/api' itself."
              exit 1
              ;;
          esac

          case "$rest" in
            *@*)
              echo "::error::VITE_API_BASE_URL='$value' must not contain userinfo ('user@host'). Use the bare origin."
              exit 1
              ;;
          esac

          echo "VITE_API_BASE_URL=$value"

      - name: Build website
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npx vite build --base=/PlayRent/

      # The check above only validates the SHAPE of the variable. Vite inlines
      # VITE_* vars at build time, so a value that never reaches the bundle
      # (env not exported, code stopped reading import.meta.env, ...) produces
      # a RELATIVE /api bundle -> every call 404s on github.io. Grep the built
      # assets for the origin and refuse to publish if it is not there.
      - name: Verify API origin is inlined
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is empty — cannot verify the bundle. Nothing was deployed."
            exit 1
          fi
          if ! grep -rqF -- "$VITE_API_BASE_URL" dist/assets; then
            echo "::error::VITE_API_BASE_URL was not inlined into the bundle — the deployed site would call github.io/api/... and 404."
            exit 1
          fi
          echo "API origin inlined: $VITE_API_BASE_URL"

      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

  # Server regression gate. Runs in PARALLEL with `build` on purpose: a broken
  # backend must not block the Pages deploy, but it still shows up as a red
  # check on the run. Make it blocking later by adding `server-test` to the
  # `needs:` list of `build`.
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 LTS: node:sqlite is unflagged since 22.13.0 and the
      # sqlite.backup() API used by src/lib/db-backup.js needs >= 22.16.0,
      # so `node-version: 22` (latest 22.x) covers both.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # `npm test` = `node --test` (auto-discovery). It picks up every
      # server/test/*.test.js AND server/test/smoke-manual.mjs, because the
      # Node test runner also matches files under a `test/` directory.
      - name: Run server tests
        working-directory: server
        run: npm test

